name: CI

# Every push and pull request: the plugin's manifest and hooks validate, its hook tests
# pass, and the cockpit server's tests pass.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  cockpit:
    name: cockpit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Test the cockpit server
        working-directory: plugins/tower/cockpit
        run: node --test test/model.test.mjs test/server.test.mjs test/actions.test.mjs

  plugin:
    name: plugin validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate the marketplace and the plugin
        run: |
          claude plugin validate .
          claude plugin validate plugins/tower

      - name: Run the plugin's hook tests
        run: claude plugin test plugins/tower
